name: Reference tools
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.89.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          brew install autoconf automake libtool gnu-sed gettext libsodium lowdown pkgconf openssl@3 make sqlite uv
          rustup toolchain install 1.89.0 --profile minimal
      - name: Build peers and run upstream async tests
        run: scripts/build-references "$RUNNER_TEMP/lightning-references" > "$RUNNER_TEMP/reference-build.log" 2>&1
      - name: Exercise the extracted harness
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'lightning-references'
          manifest = json.loads((root / 'reference-manifest.json').read_text())
          assert manifest['reference_harness']['commit'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          harness = root / 'harness/target/debug/winnow-lightning-reference'
          def call(command, **fields):
              return json.loads(subprocess.check_output([harness], input=json.dumps(dict(command=command, **fields)) + '\n', text=True))
          vectors = call('vectors')
          assert vectors['ok'], vectors
          offer = call('offer', string=vectors['result']['offer'])
          assert offer['ok'] and offer['result']['roundtrip'] == vectors['result']['offer'], offer
          invoice = call('static_invoice', hex=vectors['result']['static_invoice'])
          assert invoice['ok'], invoice
          assert not call('static_invoice', hex='00')['ok']
          print('Extracted LDK harness generated and validated offers and static invoices; malformed invoice rejected.')
          PY
      - name: Preserve build and reference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lightning-reference-evidence
          path: |
            ${{ runner.temp }}/reference-build.log
            ${{ runner.temp }}/lightning-references/reference-manifest.json
            ${{ runner.temp }}/lightning-references/ldk-async-*.log
          retention-days: 14
